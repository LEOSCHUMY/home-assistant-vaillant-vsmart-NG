name: Dependency security

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-environment-audit:
    name: Audit current HA and test dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the current environment in isolation
        run: |
          python -m venv "$RUNNER_TEMP/vsmart-current"
          "$RUNNER_TEMP/vsmart-current/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/vsmart-current/bin/python" -m pip install -r requirements.txt
      - name: Install audit tooling separately
        run: |
          python -m venv "$RUNNER_TEMP/vsmart-audit"
          "$RUNNER_TEMP/vsmart-audit/bin/python" -m pip install -r requirements-audit.txt
      - name: Audit without vulnerability exclusions
        run: |
          SITE_PACKAGES=$("$RUNNER_TEMP/vsmart-current/bin/python" -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
          "$RUNNER_TEMP/vsmart-audit/bin/python" -m pip_audit --path "$SITE_PACKAGES"
