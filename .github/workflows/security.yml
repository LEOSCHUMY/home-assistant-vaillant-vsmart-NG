name: Dependency security

on:
  push:
    branches: [dev, master, hacs]
  pull_request:
    branches: [dev, master, hacs]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
env:
  # Same exact candidate as the test workflow; never a moving branch URL.
  VSMART_LIBRARY_CANDIDATE: "vaillant-netatmo-api-ng @ https://github.com/LEOSCHUMY/vaillant-netatmo-api-NG/archive/eab91cbe180f86bc6b34355e4f30a08e26566fbf.zip"

jobs:
  current-environment-audit:
    name: Audit current HA and test dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the current environment in isolation
        run: |
          python -m venv "$RUNNER_TEMP/vsmart-current"
          "$RUNNER_TEMP/vsmart-current/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/vsmart-current/bin/python" -m pip install --no-deps "$VSMART_LIBRARY_CANDIDATE"
          "$RUNNER_TEMP/vsmart-current/bin/python" -m pip install -r requirements.txt
      - name: Install audit tooling separately
        run: |
          python -m venv "$RUNNER_TEMP/vsmart-audit"
          "$RUNNER_TEMP/vsmart-audit/bin/python" -m pip install -r requirements-audit.txt
      - name: Snapshot every external installed distribution
        run: |
          "$RUNNER_TEMP/vsmart-current/bin/python" - "$RUNNER_TEMP/vsmart-dependencies.txt" <<'PY'
          from importlib.metadata import distributions
          from pathlib import Path
          import sys

          requirements = sorted(
              f"{dist.metadata['Name']}=={dist.version}"
              for dist in distributions()
              if dist.metadata["Name"].lower().replace("_", "-") != "vaillant-netatmo-api-ng"
          )
          Path(sys.argv[1]).write_text("\n".join(requirements) + "\n", encoding="utf-8")
          PY
      - name: Audit external dependencies without vulnerability exclusions
        run: |
          "$RUNNER_TEMP/vsmart-audit/bin/python" -m pip_audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/vsmart-dependencies.txt"
