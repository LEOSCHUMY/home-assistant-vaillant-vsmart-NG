name: "Tests"

on:
  push:
    branches:
      - "dev"
      - "master"
  pull_request:
    branches:
      - "dev"
      - "master"

permissions:
  contents: read

jobs:
  pytest:
    name: "Pytest"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v4"

      - name: "Set up Python"
        uses: "actions/setup-python@v4"
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install requirements"
        run: python3 -m pip install -r requirements.txt

      - name: "Verify published NG dependency"
        run: |
          python3 - <<'PY'
          from importlib.metadata import version
          from vaillant_netatmo_api.thermostat import ThermostatClient

          assert version("vaillant-netatmo-api-ng") == "0.1.0"
          assert hasattr(ThermostatClient, "async_get_home_status")
          print("Published NG 0.1.0 dependency verified")
          PY

      - name: "Run regression tests"
        run: python3 -m pytest -q tests/test_regression_resilience.py
