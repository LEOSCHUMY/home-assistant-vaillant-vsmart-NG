name: "Tests"

on:
  push:
    branches:
      - "dev"
      - "master"
  pull_request:
    branches:
      - "dev"
      - "master"

permissions:
  contents: read

jobs:
  pytest:
    name: "Pytest"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v4"

      - name: "Set up Python"
        uses: "actions/setup-python@v4"
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install requirements"
        run: python3 -m pip install -r requirements.txt

      - name: "Verify snapshot API dependency"
        run: |
          python3 - <<'PY'
          import json
          from importlib.metadata import distribution, version
          from vaillant_netatmo_api.thermostat import ThermostatClient

          assert version("vaillant-netatmo-api-ng") == "0.1.0"
          assert hasattr(ThermostatClient, "async_get_home_status")
          assert hasattr(ThermostatClient, "async_get_home_status_snapshot")
          direct_url = json.loads(distribution("vaillant-netatmo-api-ng").read_text("direct_url.json"))
          assert direct_url["vcs_info"]["commit_id"] == "022a983e94dc34afa481ddd03ec44ee8ec0098e2"
          print("NG snapshot API commit verified")
          PY

      - name: "Run regression tests"
        run: >-
          python3 -m pytest -q tests/test_regression_resilience.py
          tests/test_room_temperature.py tests/test_boiler_status.py
