name: "Tests"

on:
  push:
    branches:
      - "dev"
      - "master"
  pull_request:
    branches:
      - "dev"
      - "master"

permissions:
  contents: read

jobs:
  pytest:
    name: "Pytest"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 0

      - name: "Detect changes requiring code checks"
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/code_checks.py

      - name: "Set up Python"
        if: steps.changes.outputs.run == 'true'
        uses: "actions/setup-python@v4"
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install requirements"
        if: steps.changes.outputs.run == 'true'
        run: python3 -m pip install -r requirements.txt

      - name: "Verify published snapshot API dependency"
        if: steps.changes.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          from importlib.metadata import version
          from vaillant_netatmo_api.thermostat import ThermostatClient

          assert version("vaillant-netatmo-api-ng") == "0.1.1"
          assert hasattr(ThermostatClient, "async_get_home_status")
          assert hasattr(ThermostatClient, "async_get_home_status_snapshot")
          print("Published NG 0.1.1 snapshot API verified")
          PY

      - name: "Run regression tests"
        if: steps.changes.outputs.run == 'true'
        run: >-
          python3 -m pytest -q tests/test_regression_resilience.py
          tests/test_room_temperature.py tests/test_boiler_status.py
