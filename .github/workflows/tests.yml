name: "Tests"
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
permissions:
  contents: read
jobs:
  pytest:
    name: "Pytest (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: current
            python: "3.14"
            requirements: requirements.txt
          - environment: compatibility
            python: "3.12"
            requirements: requirements-compat.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install isolated test environment
        env:
          REQUIREMENTS_FILE: ${{ matrix.requirements }}
        run: |
          python -m venv "$RUNNER_TEMP/vsmart-test"
          "$RUNNER_TEMP/vsmart-test/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/vsmart-test/bin/python" -m pip install -r "$REQUIREMENTS_FILE"
      - name: Verify published snapshot API dependency
        run: |
          "$RUNNER_TEMP/vsmart-test/bin/python" - <<'PY'
          import json
          from importlib.metadata import version
          from pathlib import Path
          from vaillant_netatmo_api.thermostat import ThermostatClient

          manifest = json.loads(Path("custom_components/vaillant_vsmart/manifest.json").read_text())
          assert f"vaillant-netatmo-api-ng=={version('vaillant-netatmo-api-ng')}" in manifest["requirements"]
          assert hasattr(ThermostatClient, "async_get_home_status")
          assert hasattr(ThermostatClient, "async_get_home_status_snapshot")
          print("HA", version("homeassistant"), "API", version("vaillant-netatmo-api-ng"))
          PY
      - name: Verify integration platform imports
        run: |
          "$RUNNER_TEMP/vsmart-test/bin/python" - <<'PYCODE'
          import importlib
          import homeassistant

          for platform in ("config_flow", "climate", "water_heater", "number", "select", "sensor", "switch", "websockets"):
              importlib.import_module(f"custom_components.vaillant_vsmart.{platform}")
          print("All integration platform imports passed")
          PYCODE
      - name: Run regression tests
        run: |
          "$RUNNER_TEMP/vsmart-test/bin/python" -m pytest -q \
            tests/test_regression_resilience.py tests/test_room_temperature.py tests/test_boiler_status.py
