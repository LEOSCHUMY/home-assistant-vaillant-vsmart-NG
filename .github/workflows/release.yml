name: "Prepare release"

# Integration releases are created explicitly on GitHub after a reviewed merge.
# No automatic tags, changelog rewrites or releases on pushes to dev/master.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected integration version in manifest.json"
        required: true
        default: "0.2.1"
        type: string

permissions:
  contents: read

jobs:
  verify-release:
    name: "Verify integration version"
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout the selected ref"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Verify manifest version"
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/vaillant_vsmart_ng/manifest.json").read_text()
          )
          actual = manifest["version"]
          expected = os.environ["EXPECTED_VERSION"]
          assert actual == expected, f"Expected version {expected}, got {actual}"
          print(f"Integration manifest version verified: {actual}")
          PY
      - name: Build both variants without publishing
        run: python3 scripts/build_variants.py --output "$RUNNER_TEMP/vsmart-artifacts"
      - name: Upload review artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vsmart-domain-variants
          path: ${{ runner.temp }}/vsmart-artifacts/
          if-no-files-found: error
      - name: Export manual repository without publishing
        run: python3 scripts/export_manual_repository.py --output "$RUNNER_TEMP/vsmart-manual-repository"
      - name: Upload manual repository review snapshot
        uses: actions/upload-artifact@v7
        with:
          name: manual-repository-review
          path: ${{ runner.temp }}/vsmart-manual-repository/
          include-hidden-files: true
          if-no-files-found: error
